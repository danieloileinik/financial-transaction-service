name: dotnet test & push docker image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: restore
        run: dotnet restore
      - name: build
        run: dotnet build --no-restore
      - name: unit tests
        run: dotnet test tests/FinancialTransactionService.Tests --no-build --verbosity normal
      - name: integration tests
        run: dotnet test tests/FinancialTransactionService.IntegrationTests --no-build --verbosity normal

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/master'
    steps:
      - name: deploy to vps
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/finservice
            docker pull ghcr.io/${{ github.repository }}:latest
            docker-compose down --remove-orphans
            docker network create finservice_default || true
            
            docker run --rm \
              --network finservice_default \
              --env-file .env.production \
              --entrypoint ./efbundle \
              ghcr.io/${{ github.repository }}:latest

            docker-compose up -d
            docker image prune -f
