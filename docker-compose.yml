version: '3.8'

services:
  financial-api:
    image: financial-api:latest
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=ep-little-flower-a9o1oy3x-pooler.gwc.azure.neon.tech;Port=5432;Database=neondb;Username=neondb_owner;Password=${DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true
      - JwtSettings__Issuer=FinancialTransactionService
      - JwtSettings__Audience=FinancialTransactionService
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__ExpirationMinutes=60
      - AdminPassword=${ADMIN_PASSWORD}
    env_file:
      - .env.production
    restart: unless-stopped